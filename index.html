    <!-- PWA & Mobile Web App Meta -->

    <!-- Google Fonts Preconnect and Optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Open Graph / Facebook.
         og:image MUST be an absolute URL and SHOULD be PNG/JPEG: scrapers fetch it
         out of band, with no page to resolve a relative path against, and several
         (WhatsApp among them) still ignore WebP. A relative .webp here means the
         link previews with no image at all. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Julian Gonzalez" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:url" content="https://juliangonzalez.lat/" />
    <meta property="og:title" content="Julian Gonzalez | Software Developer" />
    <meta property="og:description" content="Portafolio profesional de Julian Gonzalez, Técnico en Sistemas y Desarrollador Full Stack." />
    <meta property="og:image" content="https://juliangonzalez.lat/picture-profile.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="800" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:image:alt" content="Julian Gonzalez, Desarrollador Full Stack" />

    <!-- Twitter. `summary` rather than `summary_large_image` because the profile
         image is portrait (800x1024); the large-image card assumes ~1.91:1 and
         would crop the face out of frame. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Julian Gonzalez | Software Developer" />
    <meta name="twitter:description" content="Portafolio profesional de Julian Gonzalez, Técnico en Sistemas y Desarrollador Full Stack." />
    <meta name="twitter:image" content="https://juliangonzalez.lat/picture-profile.png" />
    <meta name="twitter:image:alt" content="Julian Gonzalez, Desarrollador Full Stack" />
